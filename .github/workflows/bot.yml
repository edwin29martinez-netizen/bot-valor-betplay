name: Bot valor BetPlay

on:
  schedule:
    - cron: "0 15,20 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-valor
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Buscar valor y surebets
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BANCA: ${{ vars.BANCA }}
          MONTO_SUREBET: ${{ vars.MONTO_SUREBET }}
        run: python main.py
      - name: Guardar memoria del bot
        if: always()
        run: |
          git config user.name "bot-valor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Actualiza datos del bot" && git push)
